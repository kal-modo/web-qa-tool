<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Neegus: Web QA Pro V4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/konva@9.3.6/konva.min.js"></script>

    <style>
        body { background-color: #1e1e2f; color: white; user-select: none; }
        #canvas-container { border: 2px solid #4ade80; background-color: #2d2d44; }
    </style>
</head>
<body class="p-8 flex flex-col items-center">

    <h1 class="text-3xl font-bold mb-2 text-green-400">YOLO Web QA Tool (Pro V4)</h1>
    <p class="mb-4 text-sm text-gray-400">
        <b>Left-Click + Drag</b> dots. <b>Right-Click Canvas</b> to add dot. <b>[T]</b> Toggle dots. <b>[R]</b> Reset to Box.
    </p>

    <!-- Dropdown for Skins -->
    <div class="flex gap-4 mb-4 items-center bg-gray-800 p-3 rounded shadow">
        <label for="skin-select" class="text-gray-300 font-bold">Filter Skin:</label>
        <select id="skin-select" class="p-2 rounded text-black font-bold w-64">
            <option value="all">All Skins</option>
            <optgroup id="opt-pending" label="Pending Skins"></optgroup>
            <optgroup id="opt-finished" label="Finished Tagging"></optgroup>
        </select>
        
        <button id="btn-skin-done" class="bg-blue-600 px-4 py-2 rounded font-bold hover:bg-blue-500 ml-4 shadow hidden">Mark Skin as Done</button>
        <button id="btn-skin-reset" class="bg-yellow-600 px-4 py-2 rounded font-bold hover:bg-yellow-500 ml-4 shadow hidden text-black">Add Back to Tasks</button>
    </div>
    
    <div id="controls" class="flex items-center gap-4 mb-4">
        <button id="btn-prev" class="bg-gray-600 px-4 py-2 rounded font-bold hover:bg-gray-500 hidden">&larr; Prev</button>
        <span id="counter" class="font-bold text-xl w-32 text-center text-gray-300">Loading...</span>
        <button id="btn-next" class="bg-gray-600 px-4 py-2 rounded font-bold hover:bg-gray-500 hidden">Skip &rarr;</button>
    </div>

    <div class="flex gap-4 mb-6">
        <button id="btn-reset-mask" class="bg-purple-600 px-4 py-2 rounded font-bold hover:bg-purple-500 hidden">Reset to Box (R)</button>
        <button id="btn-approve" class="bg-green-500 px-6 py-2 rounded font-bold text-lg hover:bg-green-400 hidden">Save & Next</button>
        <button id="btn-reject" class="bg-red-500 px-4 py-2 rounded font-bold hover:bg-red-400 hidden">Reject</button>
    </div>

    <div id="status" class="mb-4 text-green-300 font-bold"></div>

    <!-- The Interactive Canvas -->
    <div id="canvas-container" class="rounded shadow-lg"></div>

    <script>
        let allTasks = [];
        let tasks = [];
        let currentIndex = 0;
        
        let points = [];
        let stage, layer, imageObj, imageNode, polygon, anchorGroup, tempRect;
        
        // Box Drawing State
        let isDrawingBox = false;
        let boxStartX = 0, boxStartY = 0;

        const CANVAS_WIDTH = 1000;
        const CANVAS_HEIGHT = 700;

        // Initialize Canvas
        stage = new Konva.Stage({ container: 'canvas-container', width: CANVAS_WIDTH, height: CANVAS_HEIGHT, draggable: true });
        layer = new Konva.Layer();
        stage.add(layer);
        
        anchorGroup = new Konva.Group();

        // Math Helpers
        function sqr(x) { return x * x }
        function dist2(v, w) { return sqr(v.x - w.x) + sqr(v.y - w.y) }
        function projectPointToSegment(p, v, w) {
            let l2 = dist2(v, w);
            if (l2 === 0) return { x: v.x, y: v.y };
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) };
        }
        function distToSegmentSquared(p, v, w) {
            let proj = projectPointToSegment(p, v, w);
            return dist2(p, proj);
        }
        function getRelativePointer() {
            const transform = stage.getAbsoluteTransform().copy();
            transform.invert();
            return transform.point(stage.getPointerPosition());
        }

        // Supabase Connection
        const sb = supabase.createClient(
            "https://wpyxuaznrvjgzqovckmy.supabase.co", 
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndweXh1YXpucnZqZ3pxb3Zja215Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MjQ0MDYsImV4cCI6MjEwNzAwMDQwNn0.8lkTXpve1EspGGonKHrIfCkqCWCByTCemyMObwgytuY"
        );

        // UI Elements
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnApprove = document.getElementById('btn-approve');
        const btnReject = document.getElementById('btn-reject');
        const btnResetMask = document.getElementById('btn-reset-mask');
        const counterText = document.getElementById('counter');
        const statusText = document.getElementById('status');
        const skinSelect = document.getElementById('skin-select');
        const btnSkinDone = document.getElementById('btn-skin-done');
        const btnSkinReset = document.getElementById('btn-skin-reset');
        
        function updateButtonVisibility() {
            const selectedSkin = skinSelect.value;
            if (selectedSkin === 'all') {
                btnSkinDone.classList.add('hidden');
                btnSkinReset.classList.add('hidden');
                return;
            }
            const skinTasks = allTasks.filter(t => t.skin_name === selectedSkin);
            const isFinished = skinTasks.every(t => t.status !== 'pending');
            if (isFinished) {
                btnSkinDone.classList.add('hidden');
                btnSkinReset.classList.remove('hidden');
            } else {
                btnSkinDone.classList.remove('hidden');
                btnSkinReset.classList.add('hidden');
            }
        }
        
        function updateDropdown() {
            const optPending = document.getElementById('opt-pending');
            const optFinished = document.getElementById('opt-finished');
            const currentSelection = skinSelect.value;
            
            optPending.innerHTML = '';
            optFinished.innerHTML = '';
            
            const uniqueSkins = [...new Set(allTasks.map(t => t.skin_name))];
            uniqueSkins.forEach(skin => {
                const skinTasks = allTasks.filter(t => t.skin_name === skin);
                const isFinished = skinTasks.every(t => t.status !== 'pending');
                const approvedCount = skinTasks.filter(t => t.status === 'approved').length;
                
                const opt = document.createElement('option');
                opt.value = skin;
                opt.innerText = `${skin} (${approvedCount}/${skinTasks.length})`;
                
                if (isFinished) optFinished.appendChild(opt);
                else optPending.appendChild(opt);
            });
            skinSelect.value = currentSelection;
            updateButtonVisibility();
        }

        async function initApp() {
            const { data, error } = await sb.from('qa_tasks').select('*').order('filename');
            if(error || !data || data.length === 0) { counterText.innerText = "No Tasks"; return; }
            allTasks = data;
            tasks = allTasks;
            
            updateDropdown();
            let firstPending = tasks.findIndex(t => t.status === 'pending');
            currentIndex = firstPending !== -1 ? firstPending : 0;
            
            btnPrev.classList.remove('hidden');
            btnNext.classList.remove('hidden');
            btnApprove.classList.remove('hidden');
            btnReject.classList.remove('hidden');
            btnResetMask.classList.remove('hidden');
            
            loadCurrentTask();
        }

        skinSelect.addEventListener('change', (e) => {
            const selected = e.target.value;
            tasks = selected === 'all' ? allTasks : allTasks.filter(t => t.skin_name === selected);
            updateButtonVisibility();
            let firstPending = tasks.findIndex(t => t.status === 'pending');
            currentIndex = firstPending !== -1 ? firstPending : 0;
            loadCurrentTask();
        });
        
        btnSkinDone.addEventListener('click', async () => {
            const selectedSkin = skinSelect.value;
            if(selectedSkin === 'all') return;
            if(!confirm(`Are you sure you want to approve all remaining frames for ${selectedSkin}?`)) return;
            statusText.innerText = `Approving...`;
            
            const { error } = await sb.from('qa_tasks').update({ status: 'approved' }).eq('skin_name', selectedSkin).eq('status', 'pending');
            if(error) { alert("Database error."); return; }
            
            allTasks.forEach(t => { if(t.skin_name === selectedSkin && t.status === 'pending') t.status = 'approved'; });
            updateDropdown();
            skinSelect.dispatchEvent(new Event('change'));
        });

        btnSkinReset.addEventListener('click', async () => {
            const selectedSkin = skinSelect.value;
            if(selectedSkin === 'all') return;
            if(!confirm(`Are you sure you want to move ${selectedSkin} back to the Pending queue?`)) return;
            statusText.innerText = `Moving...`;
            
            const { error } = await sb.from('qa_tasks').update({ status: 'pending' }).eq('skin_name', selectedSkin);
            if(error) { alert("Database error."); return; }
            
            allTasks.forEach(t => { if(t.skin_name === selectedSkin) t.status = 'pending'; });
            updateDropdown();
            skinSelect.dispatchEvent(new Event('change'));
        });

        function clearMask() {
            points = [];
            drawAnchors();
            statusText.innerText = "Click and Drag to draw a new bounding box...";
            stage.draggable(false); // Disable stage panning so we can drag the box
        }
        btnResetMask.addEventListener('click', clearMask);

        function loadCurrentTask() {
            if(tasks.length === 0) { statusText.innerText = "No tasks for this skin."; return; }

            const task = tasks[currentIndex];
            counterText.innerText = `${currentIndex + 1} / ${tasks.length}`;
            statusText.innerText = `Status: ${task.status.toUpperCase()} | ${task.filename}`;
            
            stage.scale({x: 1, y: 1});
            stage.position({x: 0, y: 0});
            stage.draggable(true); // Re-enable panning
            isDrawingBox = false;

            layer.destroyChildren();
            anchorGroup.destroyChildren();
            
            tempRect = new Konva.Rect({ stroke: '#4ade80', strokeWidth: 2, dash: [5, 5], visible: false });

            const { data: fileData } = sb.storage.from('dataset_frames').getPublicUrl(task.filename);
            imageObj = new Image();
            imageObj.crossOrigin = "Anonymous";
            imageObj.src = fileData.publicUrl;
            
            imageObj.onload = () => {
                const scale = Math.min(CANVAS_WIDTH / imageObj.width, CANVAS_HEIGHT / imageObj.height);
                const w = imageObj.width * scale;
                const h = imageObj.height * scale;
                const x = (CANVAS_WIDTH - w) / 2;
                const y = (CANVAS_HEIGHT - h) / 2;

                imageNode = new Konva.Image({ x, y, image: imageObj, width: w, height: h });
                layer.add(imageNode);

                const parts = task.yolo_coordinates.split(' ').map(parseFloat);
                parts.shift();
                
                points = [];
                for(let i=0; i<parts.length; i+=2) {
                    points.push(x + (parts[i] * w), y + (parts[i+1] * h));
                }

                polygon = new Konva.Line({
                    points: points, fill: 'rgba(74, 222, 128, 0.3)',
                    stroke: '#4ade80', strokeWidth: 2, closed: true
                });
                layer.add(polygon);
                layer.add(anchorGroup);
                layer.add(tempRect);

                drawAnchors();
            };
        }

        function drawAnchors() {
            anchorGroup.destroyChildren();
            polygon.points(points);
            
            for(let i=0; i<points.length; i+=2) {
                const anchor = new Konva.Circle({
                    x: points[i], y: points[i+1],
                    radius: 2, fill: 'white', stroke: '#4ade80', strokeWidth: 2,
                    draggable: true, name: i.toString()
                });

                anchor.on('dragmove', function () {
                    points[i] = this.x();
                    points[i+1] = this.y();
                    polygon.points(points);
                });

                anchor.on('dblclick', function (e) {
                    e.cancelBubble = true;
                    points.splice(i, 2);
                    drawAnchors();
                });

                anchor.on('mouseover', function () { document.body.style.cursor = 'pointer'; this.scale({x:3, y:3}); this.opacity(0.3); });
                anchor.on('mouseout', function () { document.body.style.cursor = 'default'; this.scale({x:1, y:1}); this.opacity(1); });

                anchorGroup.add(anchor);
            }
        }

        document.getElementById('canvas-container').addEventListener('contextmenu', e => e.preventDefault());

        // Mouse Events
        stage.on('mousedown', (e) => {
            if(e.target.className === 'Circle') return;
            
            // 1. Box Drawing Mode (Left Click when Empty)
            if(points.length === 0 && e.evt.button === 0) {
                isDrawingBox = true;
                const pos = getRelativePointer();
                boxStartX = pos.x;
                boxStartY = pos.y;
                tempRect.position({x: boxStartX, y: boxStartY});
                tempRect.width(0);
                tempRect.height(0);
                tempRect.visible(true);
                return;
            }
            
            // 2. Add Dot Mode (Right Click)
            if(e.evt.button === 2 && points.length > 0) {
                const pos = getRelativePointer();
                let minDist = Infinity;
                let insertIdx = 0;
                let snappedPoint = {x: pos.x, y: pos.y};
                
                for(let i=0; i<points.length; i+=2) {
                    let x1 = points[i], y1 = points[i+1];
                    let nextI = (i+2) % points.length;
                    let x2 = points[nextI], y2 = points[nextI+1];
                    let proj = projectPointToSegment(pos, {x:x1, y:y1}, {x:x2, y:y2});
                    let distSq = dist2(pos, proj);
                    if(distSq < minDist) { minDist = distSq; insertIdx = i + 2; snappedPoint = proj; }
                }
                points.splice(insertIdx, 0, snappedPoint.x, snappedPoint.y);
                drawAnchors();
            }
        });

        stage.on('mousemove', (e) => {
            if(!isDrawingBox) return;
            const pos = getRelativePointer();
            tempRect.width(pos.x - boxStartX);
            tempRect.height(pos.y - boxStartY);
        });

        stage.on('mouseup', (e) => {
            if(!isDrawingBox) return;
            isDrawingBox = false;
            tempRect.visible(false);
            
            const pos = getRelativePointer();
            
            // Convert rect to a 4-point polygon
            points = [
                boxStartX, boxStartY,
                pos.x, boxStartY,
                pos.x, pos.y,
                boxStartX, pos.y
            ];
            
            stage.draggable(true); // Re-enable panning
            drawAnchors();
            statusText.innerText = "Box generated! Adjust the corners if needed.";
        });

        async function saveTask(newStatus) {
            if(points.length < 6) {
                alert("A mask must have at least 3 points!");
                return;
            }
        
            const task = tasks[currentIndex];
            statusText.innerText = "Saving to Database...";
            const w = imageNode.width();
            const h = imageNode.height();
            const startX = imageNode.x();
            const startY = imageNode.y();

            let newYoloStr = "0";
            for(let i=0; i<points.length; i+=2) {
                let nx = Math.max(0, Math.min(1, (points[i] - startX) / w));
                let ny = Math.max(0, Math.min(1, (points[i+1] - startY) / h));
                newYoloStr += ` ${nx.toFixed(6)} ${ny.toFixed(6)}`;
            }

            const { error } = await sb.from('qa_tasks').update({ status: newStatus, yolo_coordinates: newYoloStr }).eq('id', task.id);
            if(error) { alert("Error saving!"); return; }

            task.status = newStatus;
            task.yolo_coordinates = newYoloStr;
            let masterTask = allTasks.find(t => t.id === task.id);
            if(masterTask) { masterTask.status = newStatus; masterTask.yolo_coordinates = newYoloStr; }
            
            updateDropdown();
            btnNext.click();
        }

        btnPrev.addEventListener('click', () => { if(currentIndex > 0) { currentIndex--; loadCurrentTask(); }});
        btnNext.addEventListener('click', () => { if(currentIndex < tasks.length - 1) { currentIndex++; loadCurrentTask(); }});
        btnApprove.addEventListener('click', () => saveTask('approved'));
        btnReject.addEventListener('click', () => saveTask('rejected'));

        document.addEventListener('keydown', (e) => {
            if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            const key = e.key.toLowerCase();
            if(key === 'a') btnPrev.click();
            if(key === 'd') btnNext.click();
            if(key === 'r') clearMask();
            if(key === 't') {
                const isVisible = anchorGroup.visible();
                anchorGroup.visible(!isVisible);
            }
        });

        const scaleBy = 1.1;
        stage.on('wheel', (e) => {
            e.evt.preventDefault();
            const oldScale = stage.scaleX();
            const pointer = stage.getPointerPosition();
            const mousePointTo = { x: (pointer.x - stage.x()) / oldScale, y: (pointer.y - stage.y()) / oldScale };
            let direction = e.evt.deltaY > 0 ? -1 : 1;
            if (e.evt.ctrlKey) direction = -direction;
            const newScale = direction > 0 ? oldScale * scaleBy : oldScale / scaleBy;
            stage.scale({ x: newScale, y: newScale });
            const newPos = { x: pointer.x - mousePointTo.x * newScale, y: pointer.y - mousePointTo.y * newScale };
            stage.position(newPos);
        });

        initApp();
    </script>
</body>
</html>
