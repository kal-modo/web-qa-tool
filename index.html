<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Neegus: Web QA Pro V5 (Annotate & Edit)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/konva@9.3.6/konva.min.js"></script>

    <style>
        body { background-color: #1e1e2f; color: white; user-select: none; }
        #canvas-container { border: 2px solid #4ade80; background-color: #2d2d44; position: relative; }
        input[type=number]::-webkit-inner-spin-button { opacity: 1; }
        .tab-btn.active { background-color: #22c55e; color: black; font-weight: bold; }
        .tab-btn:not(.active) { background-color: #374151; color: #9ca3af; }
    </style>
</head>
<body class="p-8 flex flex-col items-center">

    <h1 class="text-3xl font-bold mb-2 text-green-400">YOLO Web QA Tool (Pro V5)</h1>

    <!-- Mode Tabs: Annotate vs Edit -->
    <div class="flex gap-2 mb-4 bg-gray-800 p-1.5 rounded-lg border border-gray-700">
        <button id="tab-annotate" class="tab-btn active px-6 py-2 rounded-md font-bold text-sm transition">1. Annotate (Box)</button>
        <button id="tab-edit" class="tab-btn px-6 py-2 rounded-md font-bold text-sm transition">2. Edit (Polygon)</button>
    </div>

    <!-- Instructions banner (dynamic per mode) -->
    <p id="mode-instructions" class="mb-4 text-sm text-gray-300 text-center max-w-2xl">
        <b>[Annotate Mode]</b> Drag box around character body. <b>[D]</b> Next / Save. <b>[A]</b> Prev. <b>[R]</b> Re-box. <b>[Z]</b> Undo.
    </p>

    <!-- Dropdown for Skins & Actions -->
    <div class="flex flex-wrap gap-4 mb-4 items-center bg-gray-800 p-3 rounded shadow">
        <label for="skin-select" class="text-gray-300 font-bold">Skin:</label>
        <select id="skin-select" class="p-2 rounded text-black font-bold w-64">
            <optgroup id="opt-pending" label="Pending"></optgroup>
            <optgroup id="opt-finished" label="Finished"></optgroup>
        </select>
        
        <button id="btn-skin-done" class="bg-blue-600 px-4 py-2 rounded font-bold hover:bg-blue-500 ml-2 shadow hidden">Finish Skin</button>
        <button id="btn-skin-reset" class="bg-yellow-600 px-4 py-2 rounded font-bold hover:bg-yellow-500 ml-2 shadow hidden text-black">Reset Skin</button>
    </div>
    
    <div id="controls" class="flex items-center gap-4 mb-4">
        <button id="btn-prev" class="bg-gray-600 px-4 py-2 rounded font-bold hover:bg-gray-500 hidden">&larr; Prev (A)</button>
        
        <div class="flex items-center gap-2 px-4">
            <span class="text-gray-400">Frame:</span>
            <input type="number" id="frame-input" class="w-20 bg-gray-700 text-white font-bold text-center p-1 rounded shadow" min="1" value="1" />
            <span class="text-gray-300 font-bold">/ <span id="total-frames">0</span></span>
        </div>
        
        <button id="btn-next" class="bg-gray-600 px-4 py-2 rounded font-bold hover:bg-gray-500 hidden">Next &rarr; (D)</button>
    </div>

    <div class="flex flex-wrap gap-3 mb-6 items-center justify-center">
        <button id="btn-undo" class="bg-blue-600 px-5 py-2 rounded font-bold hover:bg-blue-500 hidden text-white shadow">Undo (Z)</button>
        <button id="btn-reset-mask" class="bg-purple-600 px-4 py-2 rounded font-bold hover:bg-purple-500 hidden">Clear / Re-Box (R)</button>
        <button id="btn-approve" class="bg-green-500 px-6 py-2 rounded font-bold text-lg hover:bg-green-400 hidden">Approve (W)</button>
        <button id="btn-reject" class="bg-red-500 px-4 py-2 rounded font-bold hover:bg-red-400 hidden">Reject</button>
    </div>

    <div id="status" class="mb-4 text-green-300 font-bold min-h-[24px]"></div>

    <!-- The Interactive Canvas -->
    <div id="canvas-container" class="rounded shadow-lg"></div>

    <script>
        // App Modes: 'annotate' (Big Boxes) | 'edit' (Polygon Nudging & Vertex Deletion)
        let currentMode = 'annotate';
        
        let allTasks = [];
        let tasks = [];
        let currentIndex = 0;
        
        let points = [];
        let pointsHistory = [];
        let copiedMask = null;
        let stage, layer, imageObj, imageNode, polygon, anchorGroup, tempRect;
        
        let isImageLoading = false;
        
        // Box Drawing State (Annotate mode)
        let isDrawingBox = false;
        let boxStartX = 0, boxStartY = 0;

        // Mask Move State (Ctrl + Drag)
        let isMovingMask = false;
        let maskMoveLastPos = null;

        // Vertex Eraser State (Hold Backspace)
        let isHoldingBackspace = false;

        const CANVAS_WIDTH = 1000;
        const CANVAS_HEIGHT = 700;

        // Initialize Canvas
        stage = new Konva.Stage({ container: 'canvas-container', width: CANVAS_WIDTH, height: CANVAS_HEIGHT, draggable: true });
        layer = new Konva.Layer();
        stage.add(layer);
        
        anchorGroup = new Konva.Group();

        // Math Helpers
        function sqr(x) { return x * x }
        function dist2(v, w) { return sqr(v.x - w.x) + sqr(v.y - w.y) }
        function projectPointToSegment(p, v, w) {
            let l2 = dist2(v, w);
            if (l2 === 0) return { x: v.x, y: v.y };
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) };
        }
        function getRelativePointer() {
            const transform = stage.getAbsoluteTransform().copy();
            transform.invert();
            return transform.point(stage.getPointerPosition());
        }

        // Supabase Connection
        const sb = supabase.createClient(
            "https://wpyxuaznrvjgzqovckmy.supabase.co", 
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndweXh1YXpucnZqZ3pxb3Zja215Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MjQ0MDYsImV4cCI6MjEwNzAwMDQwNn0.8lkTXpve1EspGGonKHrIfCkqCWCByTCemyMObwgytuY"
        );

        // UI Elements
        const tabAnnotate = document.getElementById('tab-annotate');
        const tabEdit = document.getElementById('tab-edit');
        const modeInstructions = document.getElementById('mode-instructions');

        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnApprove = document.getElementById('btn-approve');
        const btnReject = document.getElementById('btn-reject');
        const btnResetMask = document.getElementById('btn-reset-mask');
        const btnUndo = document.getElementById('btn-undo');
        const frameInput = document.getElementById('frame-input');
        const totalFrames = document.getElementById('total-frames');
        const statusText = document.getElementById('status');
        const skinSelect = document.getElementById('skin-select');
        const btnSkinDone = document.getElementById('btn-skin-done');
        const btnSkinReset = document.getElementById('btn-skin-reset');

        // Helpers to classify task state
        function isAnnotated(t) {
            // Boxed: has 8 coords (4 corners) or status is 'annotated'
            const parts = (t.yolo_coordinates || '').trim().split(/\s+/);
            const numCoords = parts.length > 1 ? parts.length - 1 : 0;
            return t.status === 'annotated' || numCoords === 8;
        }

        function isPendingAnnotation(t) {
            if (t.status === 'approved' || t.status === 'pending_edit') return false;
            return !isAnnotated(t);
        }

        function isPendingEdit(t) {
            if (t.status === 'approved') return false;
            // Either status explicitly set to pending_edit or has polygon (> 8 coords)
            const parts = (t.yolo_coordinates || '').trim().split(/\s+/);
            const numCoords = parts.length > 1 ? parts.length - 1 : 0;
            return t.status === 'pending_edit' || (t.status !== 'annotated' && numCoords > 8);
        }

        function isFinishedEditing(t) {
            return t.status === 'approved';
        }

        function updateModeUI() {
            if (currentMode === 'annotate') {
                tabAnnotate.classList.add('active');
                tabEdit.classList.remove('active');
                btnApprove.classList.add('hidden'); // Annotate mode does NOT need approve button
                btnResetMask.innerText = "Re-Box (R)";
                modeInstructions.innerHTML = `<b>[Annotate Mode]</b> Drag box around character body. <b>[D]</b> Next / Auto-Save. <b>[A]</b> Prev. <b>[R]</b> Re-box. <b>[Z]</b> Undo.`;
                btnSkinDone.innerText = "Mark Skin as Finished Annotating";
                btnSkinReset.innerText = "Reset Skin to Blank";
            } else {
                tabEdit.classList.add('active');
                tabAnnotate.classList.remove('active');
                btnApprove.classList.remove('hidden'); // Edit mode requires approval
                btnResetMask.innerText = "Clear Mask (R)";
                modeInstructions.innerHTML = `<b>[Edit Mode]</b> Drag dots to nudge. <b>Hold [Backspace] & Hover</b> over dots to rapidly delete. <b>[W]</b> Approve. <b>[D]</b> Skip. <b>[A]</b> Prev.`;
                btnSkinDone.innerText = "Mark Skin as Finished Editing";
                btnSkinReset.innerText = "Send Skin Back to Edit";
            }
            updateDropdown();
        }

        tabAnnotate.addEventListener('click', () => {
            if (currentMode === 'annotate') return;
            navigate('save_only');
            currentMode = 'annotate';
            updateModeUI();
            skinSelect.dispatchEvent(new Event('change'));
        });

        tabEdit.addEventListener('click', () => {
            if (currentMode === 'edit') return;
            navigate('save_only');
            currentMode = 'edit';
            updateModeUI();
            skinSelect.dispatchEvent(new Event('change'));
        });

        function updateButtonVisibility() {
            const selectedSkin = skinSelect.value;
            if (!selectedSkin) return;
            
            const skinTasks = allTasks.filter(t => t.skin_name === selectedSkin);
            if (currentMode === 'annotate') {
                const isFinished = skinTasks.every(t => isAnnotated(t) || t.status === 'approved' || t.status === 'pending_edit');
                if (isFinished) {
                    btnSkinDone.classList.add('hidden');
                    btnSkinReset.classList.remove('hidden');
                } else {
                    btnSkinDone.classList.remove('hidden');
                    btnSkinReset.classList.add('hidden');
                }
            } else {
                const isFinished = skinTasks.every(t => t.status === 'approved');
                if (isFinished) {
                    btnSkinDone.classList.add('hidden');
                    btnSkinReset.classList.remove('hidden');
                } else {
                    btnSkinDone.classList.remove('hidden');
                    btnSkinReset.classList.add('hidden');
                }
            }
        }
        
        function updateDropdown() {
            const optPending = document.getElementById('opt-pending');
            const optFinished = document.getElementById('opt-finished');
            const currentSelection = skinSelect.value;
            
            optPending.innerHTML = '';
            optFinished.innerHTML = '';
            
            if (currentMode === 'annotate') {
                optPending.label = "Pending Annotation";
                optFinished.label = "Finished Annotating";
            } else {
                optPending.label = "Pending Edit";
                optFinished.label = "Finished Editing";
            }
            
            const uniqueSkins = [...new Set(allTasks.map(t => t.skin_name))];
            uniqueSkins.forEach(skin => {
                const skinTasks = allTasks.filter(t => t.skin_name === skin);
                const total = skinTasks.length;
                let doneCount = 0;
                let isSkinDone = false;
                
                if (currentMode === 'annotate') {
                    doneCount = skinTasks.filter(t => isAnnotated(t) || t.status === 'approved' || t.status === 'pending_edit').length;
                    isSkinDone = (doneCount === total);
                } else {
                    doneCount = skinTasks.filter(t => t.status === 'approved').length;
                    isSkinDone = (doneCount === total);
                }
                
                const opt = document.createElement('option');
                opt.value = skin;
                opt.innerText = `${skin} (${doneCount}/${total})`;
                
                if (isSkinDone) {
                    optFinished.appendChild(opt);
                } else {
                    optPending.appendChild(opt);
                }
            });
            
            if (uniqueSkins.includes(currentSelection)) {
                skinSelect.value = currentSelection;
            } else if (skinSelect.options.length > 0) {
                skinSelect.selectedIndex = 0;
            }
            updateButtonVisibility();
        }

        async function initApp() {
            const { data, error } = await sb.from('qa_tasks').select('*').neq('status', 'rejected').order('filename');
            if(error || !data || data.length === 0) { totalFrames.innerText = "0"; return; }
            allTasks = data;
            
            updateModeUI();
            
            const initialSkin = skinSelect.value;
            tasks = allTasks.filter(t => t.skin_name === initialSkin);
            
            currentIndex = 0;
            
            btnPrev.classList.remove('hidden');
            btnNext.classList.remove('hidden');
            btnReject.classList.remove('hidden');
            btnResetMask.classList.remove('hidden');
            btnUndo.classList.remove('hidden');
            
            loadCurrentTask();
        }

        skinSelect.addEventListener('change', (e) => {
            navigate('save_only');
            const selected = e.target.value;
            tasks = allTasks.filter(t => t.skin_name === selected);
            updateButtonVisibility();
            
            // Jump to first pending task for current mode
            let targetIdx = -1;
            if (currentMode === 'annotate') {
                targetIdx = tasks.findIndex(t => isPendingAnnotation(t));
            } else {
                targetIdx = tasks.findIndex(t => t.status !== 'approved');
            }
            currentIndex = targetIdx !== -1 ? targetIdx : 0;
            loadCurrentTask();
            e.target.blur();
        });
        
        btnSkinDone.addEventListener('click', async () => {
            const selectedSkin = skinSelect.value;
            if(!selectedSkin) return;
            
            if (currentMode === 'annotate') {
                if(!confirm(`Mark all frames for ${selectedSkin} as Finished Annotating (Ready for SAM)?`)) return;
                statusText.innerText = `Updating...`;
                
                // Set non-approved tasks with boxes to 'annotated'
                const { error } = await sb.from('qa_tasks')
                    .update({ status: 'annotated' })
                    .eq('skin_name', selectedSkin)
                    .neq('status', 'approved')
                    .neq('status', 'rejected');
                    
                if(error) { alert("Database error: " + error.message); return; }
                allTasks.forEach(t => { 
                    if(t.skin_name === selectedSkin && t.status !== 'approved' && t.status !== 'rejected') {
                        t.status = 'annotated'; 
                    }
                });
            } else {
                if(!confirm(`Approve all remaining frames for ${selectedSkin} (Finished Editing)?`)) return;
                statusText.innerText = `Approving...`;
                
                const { error } = await sb.from('qa_tasks')
                    .update({ status: 'approved' })
                    .eq('skin_name', selectedSkin)
                    .neq('status', 'rejected');
                    
                if(error) { alert("Database error: " + error.message); return; }
                allTasks.forEach(t => { 
                    if(t.skin_name === selectedSkin && t.status !== 'rejected') {
                        t.status = 'approved'; 
                    }
                });
            }
            
            updateDropdown();
            skinSelect.dispatchEvent(new Event('change'));
        });

        btnSkinReset.addEventListener('click', async () => {
            const selectedSkin = skinSelect.value;
            if(!selectedSkin) return;
            
            if (currentMode === 'annotate') {
                if(!confirm(`Reset annotation status for ${selectedSkin} back to pending?`)) return;
                statusText.innerText = `Resetting...`;
                const { error } = await sb.from('qa_tasks').update({ status: 'pending' }).eq('skin_name', selectedSkin).neq('status', 'approved');
                if(error) { alert("Database error: " + error.message); return; }
                allTasks.forEach(t => { if(t.skin_name === selectedSkin && t.status !== 'approved') t.status = 'pending'; });
            } else {
                if(!confirm(`Send ${selectedSkin} back to Pending Edit?`)) return;
                statusText.innerText = `Updating...`;
                const { error } = await sb.from('qa_tasks').update({ status: 'pending_edit' }).eq('skin_name', selectedSkin);
                if(error) { alert("Database error: " + error.message); return; }
                allTasks.forEach(t => { if(t.skin_name === selectedSkin) t.status = 'pending_edit'; });
            }
            
            updateDropdown();
            skinSelect.dispatchEvent(new Event('change'));
        });

        // Undo System
        function saveState() {
            pointsHistory.push([...points]);
            if (pointsHistory.length > 30) pointsHistory.shift();
        }

        function applyUndo() {
            if (pointsHistory.length > 0) {
                points = pointsHistory.pop();
                drawAnchors();
                statusText.innerText = "Undo applied!";
            } else {
                statusText.innerText = "Nothing to undo in this frame.";
            }
        }

        function clearMask() {
            saveState();
            points = [];
            anchorGroup.destroyChildren();
            polygon.points([]);
            layer.batchDraw();
            stage.draggable(false);
            statusText.innerText = "Mask cleared. Click and drag to draw a box.";
        }

        // Copy / Paste Mask
        function copyMask() {
            if (!imageNode || points.length < 6) {
                statusText.innerText = "No valid mask to copy!";
                return;
            }
            const w = imageNode.width();
            const h = imageNode.height();
            const startX = imageNode.x();
            const startY = imageNode.y();
            let normPoints = [];
            for (let i = 0; i < points.length; i += 2) {
                normPoints.push(
                    Math.max(0, Math.min(1, (points[i] - startX) / w)),
                    Math.max(0, Math.min(1, (points[i+1] - startY) / h))
                );
            }
            copiedMask = normPoints;
            statusText.innerText = `Mask copied (${normPoints.length / 2} points)! Press [V] on any frame to paste.`;
        }

        function pasteMask() {
            if (!copiedMask || copiedMask.length < 6) {
                statusText.innerText = "No mask in clipboard! Press [C] to copy a mask first.";
                return;
            }
            if (!imageNode) return;
            saveState();
            const w = imageNode.width();
            const h = imageNode.height();
            const startX = imageNode.x();
            const startY = imageNode.y();
            points = [];
            for (let i = 0; i < copiedMask.length; i += 2) {
                points.push(startX + (copiedMask[i] * w), startY + (copiedMask[i+1] * h));
            }
            drawAnchors();
            statusText.innerText = "Mask pasted from clipboard!";
        }

        // Core Navigation and Auto-Saving Logic
        function navigate(direction, targetIndex = null, forceStatus = null) {
            if (tasks.length === 0 || isImageLoading) return;
            
            const task = tasks[currentIndex];
            let newStatus = forceStatus !== null ? forceStatus : task.status;
            let newYoloStr = task.yolo_coordinates;
            
            if (newStatus === 'rejected') {
                sb.from('qa_tasks').update({ status: 'rejected', yolo_coordinates: '0' }).eq('id', task.id).then(res => {
                    if (res.error) alert("Database Error: " + res.error.message);
                });
                allTasks = allTasks.filter(t => t.id !== task.id);
                tasks = tasks.filter(t => t.id !== task.id);
                
                updateDropdown();
                if (currentIndex >= tasks.length) currentIndex = Math.max(0, tasks.length - 1);
                loadCurrentTask();
                return;
            }
            
            if (imageNode) {
                if (points.length >= 6) {
                    const w = imageNode.width();
                    const h = imageNode.height();
                    const startX = imageNode.x();
                    const startY = imageNode.y();
                    
                    const origParts = task.yolo_coordinates.split(' ');
                    const classId = origParts.length > 0 ? origParts[0] : "0";
                    newYoloStr = classId;
                    
                    for(let i=0; i<points.length; i+=2) {
                        let nx = Math.max(0, Math.min(1, (points[i] - startX) / w));
                        let ny = Math.max(0, Math.min(1, (points[i+1] - startY) / h));
                        newYoloStr += ` ${nx.toFixed(6)} ${ny.toFixed(6)}`;
                    }

                    // In Annotate mode: if box has 8 coordinates (4 points) and is not approved, set status = 'annotated'
                    if (currentMode === 'annotate' && newStatus !== 'approved') {
                        if (points.length === 8) {
                            newStatus = 'annotated';
                        }
                    }
                } else if (newStatus === 'approved') {
                    alert("A character mask is required to approve this frame! (Or click Reject if there is no character).");
                    return;
                } else {
                    newYoloStr = task.yolo_coordinates;
                }
            }
            
            task.yolo_coordinates = newYoloStr;
            task.status = newStatus;
            
            let masterTask = allTasks.find(t => t.id === task.id);
            if(masterTask) { masterTask.yolo_coordinates = newYoloStr; masterTask.status = newStatus; }
            
            // Fire and forget database update
            sb.from('qa_tasks').update({ yolo_coordinates: newYoloStr, status: newStatus }).eq('id', task.id).then(res => {
                if (res.error) alert("Database Error: " + res.error.message);
                updateDropdown();
            });
            
            if (direction === 'save_only') return;
            
            // 2. Change Index
            if (direction === 'prev' && currentIndex > 0) currentIndex--;
            else if (direction === 'next' && currentIndex < tasks.length - 1) currentIndex++;
            else if (direction === 'jump' && targetIndex !== null) currentIndex = targetIndex;
            
            // 3. Load
            loadCurrentTask();
        }

        btnPrev.addEventListener('click', () => navigate('prev'));
        btnNext.addEventListener('click', () => navigate('next'));
        btnApprove.addEventListener('click', () => navigate('next', null, 'approved'));
        btnReject.addEventListener('click', () => {
            if(confirm("Reject this frame? It will be removed from dataset.")) {
                navigate('save_only', null, 'rejected');
            }
        });
        btnResetMask.addEventListener('click', clearMask);
        btnUndo.addEventListener('click', applyUndo);

        frameInput.addEventListener('change', (e) => {
            let val = parseInt(e.target.value, 10);
            if(isNaN(val) || val < 1) val = 1;
            if(val > tasks.length) val = tasks.length;
            navigate('jump', val - 1);
        });

        function loadCurrentTask() {
            if (tasks.length === 0) {
                statusText.innerText = "No tasks found for this skin.";
                frameInput.value = 0;
                totalFrames.innerText = "0";
                layer.destroyChildren();
                layer.batchDraw();
                return;
            }

            isImageLoading = true;
            pointsHistory = [];
            
            const task = tasks[currentIndex];
            frameInput.value = currentIndex + 1;
            totalFrames.innerText = tasks.length;
            
            statusText.innerText = `Loading ${task.filename}... [Status: ${task.status}]`;

            // Reset canvas zoom & position
            stage.scale({ x: 1, y: 1 });
            stage.position({ x: 0, y: 0 });

            layer.destroyChildren();
            anchorGroup.destroyChildren();
            
            tempRect = new Konva.Rect({ stroke: '#4ade80', strokeWidth: 2, dash: [5, 5], visible: false });

            const { data: fileData } = sb.storage.from('dataset_frames').getPublicUrl(task.filename);
            
            const currentImg = new Image();
            currentImg.crossOrigin = "Anonymous";
            currentImg.src = fileData.publicUrl;
            
            currentImg.onload = () => {
                if (tasks[currentIndex].id !== task.id) return;
                
                isImageLoading = false;
                imageObj = currentImg;
                
                const scale = Math.min(CANVAS_WIDTH / currentImg.width, CANVAS_HEIGHT / currentImg.height);
                const w = currentImg.width * scale;
                const h = currentImg.height * scale;
                const x = (CANVAS_WIDTH - w) / 2;
                const y = (CANVAS_HEIGHT - h) / 2;

                imageNode = new Konva.Image({ x, y, image: currentImg, width: w, height: h });
                layer.add(imageNode);

                const parts = task.yolo_coordinates.split(' ').map(parseFloat);
                parts.shift(); // Remove class ID
                
                points = [];
                for(let i=0; i<parts.length; i+=2) {
                    if(!isNaN(parts[i]) && !isNaN(parts[i+1])) {
                        points.push(x + (parts[i] * w), y + (parts[i+1] * h));
                    }
                }

                polygon = new Konva.Line({
                    points: points, fill: 'rgba(74, 222, 128, 0.3)',
                    stroke: '#4ade80', strokeWidth: 2, closed: true
                });
                layer.add(polygon);
                layer.add(anchorGroup);
                layer.add(tempRect);

                drawAnchors();

                // Annotate mode & blank: enable box drawing
                if (points.length < 6) {
                    stage.draggable(false);
                    statusText.innerText = `[Blank] Click and drag box around character body | ${task.filename}`;
                } else {
                    stage.draggable(true);
                    const ptCount = points.length / 2;
                    if (currentMode === 'edit') {
                        statusText.innerText = `[Edit Mode] ${ptCount} vertices | Hold [Backspace] & hover to delete | ${task.filename}`;
                    } else {
                        statusText.innerText = `[Boxed] ${ptCount} points | ${task.filename}`;
                    }
                }
            };
        }

        function drawAnchors() {
            anchorGroup.destroyChildren();
            polygon.points(points);
            
            const isEditMode = (currentMode === 'edit');
            const ptCount = points.length / 2;
            const circleRadius = ptCount > 50 ? 2 : 3;
            
            for(let i=0; i<points.length; i+=2) {
                const anchor = new Konva.Circle({
                    x: points[i], y: points[i+1],
                    radius: circleRadius, fill: 'white', stroke: '#4ade80', strokeWidth: 1.5,
                    draggable: true, name: i.toString()
                });

                anchor.on('dragstart', function () {
                    saveState();
                });

                anchor.on('dragmove', function () {
                    points[i] = this.x();
                    points[i+1] = this.y();
                    polygon.points(points);
                });

                // Double click deletes single point
                anchor.on('dblclick', function (e) {
                    e.cancelBubble = true;
                    if (points.length <= 6) {
                        statusText.innerText = "Polygon must have at least 3 vertices!";
                        return;
                    }
                    saveState();
                    points.splice(i, 2);
                    drawAnchors();
                });

                // Rapid vertex eraser: If holding Backspace, hovering deletes the vertex!
                anchor.on('mouseenter', function (e) {
                    if (isHoldingBackspace) {
                        if (points.length <= 6) {
                            statusText.innerText = "Minimum 3 vertices required!";
                            return;
                        }
                        saveState();
                        points.splice(i, 2);
                        drawAnchors();
                        statusText.innerText = `Deleted vertex! (${points.length / 2} remaining)`;
                        return;
                    }
                    document.body.style.cursor = 'pointer';
                    this.scale({x:1.8, y:1.8});
                    this.opacity(0.3);
                });

                anchor.on('mouseleave', function () {
                    document.body.style.cursor = 'default';
                    this.scale({x:1, y:1});
                    this.opacity(1);
                });

                anchorGroup.add(anchor);
            }
            layer.batchDraw();
        }

        document.getElementById('canvas-container').addEventListener('contextmenu', e => e.preventDefault());

        stage.on('mousedown', (e) => {
            // Check for Ctrl + Left Click to drag the entire mask
            if (e.evt.button === 0 && e.evt.ctrlKey && points.length > 0) {
                isMovingMask = true;
                maskMoveLastPos = getRelativePointer();
                stage.draggable(false);
                saveState();
                statusText.innerText = "Dragging entire mask... Release mouse to set.";
                return;
            }

            if(e.target.className === 'Circle') return;
            
            // In Annotate mode: Left click to draw bounding box
            if(points.length === 0 && e.evt.button === 0) {
                isDrawingBox = true;
                const pos = getRelativePointer();
                boxStartX = pos.x;
                boxStartY = pos.y;
                tempRect.position({x: boxStartX, y: boxStartY});
                tempRect.width(0);
                tempRect.height(0);
                tempRect.visible(true);
                return;
            }
            
            // In Edit mode: Right click adds a new point to nearest edge
            if(e.evt.button === 2 && points.length > 0) {
                saveState();
                
                const pos = getRelativePointer();
                let minDist = Infinity;
                let insertIdx = 0;
                let snappedPoint = {x: pos.x, y: pos.y};
                
                for(let i=0; i<points.length; i+=2) {
                    let x1 = points[i], y1 = points[i+1];
                    let nextI = (i+2) % points.length;
                    let x2 = points[nextI], y2 = points[nextI+1];
                    let proj = projectPointToSegment(pos, {x:x1, y:y1}, {x:x2, y:y2});
                    let distSq = dist2(pos, proj);
                    if(distSq < minDist) { minDist = distSq; insertIdx = i + 2; snappedPoint = proj; }
                }
                points.splice(insertIdx, 0, snappedPoint.x, snappedPoint.y);
                drawAnchors();
                statusText.innerText = `Added point! (${points.length / 2} total)`;
            }
        });

        stage.on('mousemove', (e) => {
            if (isMovingMask && maskMoveLastPos) {
                const currentPos = getRelativePointer();
                const dx = currentPos.x - maskMoveLastPos.x;
                const dy = currentPos.y - maskMoveLastPos.y;
                maskMoveLastPos = currentPos;

                for (let i = 0; i < points.length; i += 2) {
                    points[i] += dx;
                    points[i+1] += dy;
                }
                polygon.points(points);
                anchorGroup.children.forEach((circle, idx) => {
                    circle.x(points[idx * 2]);
                    circle.y(points[idx * 2 + 1]);
                });
                layer.batchDraw();
                return;
            }

            if(!isDrawingBox) return;
            const pos = getRelativePointer();
            tempRect.width(pos.x - boxStartX);
            tempRect.height(pos.y - boxStartY);
        });

        stage.on('mouseup', (e) => {
            if (isMovingMask) {
                isMovingMask = false;
                maskMoveLastPos = null;
                stage.draggable(true);
                drawAnchors();
                statusText.innerText = "Mask repositioned!";
                return;
            }

            if(!isDrawingBox) return;
            isDrawingBox = false;
            tempRect.visible(false);
            
            saveState();

            const pos = getRelativePointer();
            points = [ boxStartX, boxStartY, pos.x, boxStartY, pos.x, pos.y, boxStartX, pos.y ];
            
            stage.draggable(true);
            drawAnchors();
            statusText.innerText = "Box drawn! Press [D] for next frame or adjust corners.";
        });

        // Keyboard Mappings
        document.addEventListener('keydown', (e) => {
            if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            
            // Hold Backspace for rapid vertex delete
            if (e.key === 'Backspace') {
                e.preventDefault(); // Prevent browser navigating back!
                if (!isHoldingBackspace) {
                    isHoldingBackspace = true;
                    document.body.style.cursor = 'crosshair';
                    statusText.innerText = "[ERASER ACTIVE] Hover over dots to delete!";
                }
                return;
            }

            const key = e.key.toLowerCase();
            if(key === 'a') navigate('prev');
            if(key === 'd') navigate('next');
            if(key === 'w') {
                if (currentMode === 'edit') {
                    navigate('next', null, 'approved');
                } else {
                    navigate('next'); // In Annotate mode, W simply moves next
                }
            }
            if(key === 'c') copyMask();
            if(key === 'v') pasteMask();
            if(key === 'r') clearMask();
            if(key === 'z') applyUndo();
            if(key === 't') {
                const isVisible = anchorGroup.visible();
                anchorGroup.visible(!isVisible);
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'Backspace') {
                isHoldingBackspace = false;
                document.body.style.cursor = 'default';
                statusText.innerText = `Eraser off (${points.length / 2} vertices).`;
            }
        });

        // Zoom Logic
        const scaleBy = 1.1;
        stage.on('wheel', (e) => {
            e.evt.preventDefault();
            const oldScale = stage.scaleX();
            const pointer = stage.getPointerPosition();
            const mousePointTo = { x: (pointer.x - stage.x()) / oldScale, y: (pointer.y - stage.y()) / oldScale };
            let direction = e.evt.deltaY > 0 ? -1 : 1;
            if (e.evt.ctrlKey) direction = -direction;
            const newScale = direction > 0 ? oldScale * scaleBy : oldScale / scaleBy;
            stage.scale({ x: newScale, y: newScale });
            const newPos = { x: pointer.x - mousePointTo.x * newScale, y: pointer.y - mousePointTo.y * newScale };
            stage.position(newPos);
        });

        initApp();
    </script>
</body>
</html>
